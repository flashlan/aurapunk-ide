name: AuraPunk IDE release (npm + GitHub binaries)

# Builds and publishes ONLY when a version tag is pushed (e.g. `v0.1.0`).
# Ordinary commits/pushes do nothing. The release tag must equal the npm version
# in npx-cli/package.json (`v<version>`), which is also how the CLI derives the
# binary download URL at runtime (see npx-cli/src/download.ts).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # run manually against a tag ref

permissions:
  contents: write # create the GitHub Release + upload assets

concurrency:
  group: release-alternative-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Must match rust-toolchain.toml — otherwise the toolchain file overrides
  # whatever the action installs and the requested matrix target is missing.
  RUST_TOOLCHAIN: stable
  # Pin zig so transient mirror 404s don't break the linux-musl matrix legs.
  ZIG_VERSION: "0.13.0"

jobs:
  # 0) Pick the build matrix from the tag: stable -> all 6 targets; prerelease
  #    (beta/rc, i.e. the tag contains a `-`) -> macOS arm64 only, to keep the
  #    beta channel fast. The downstream manifest/CLI handle a partial platform
  #    set (only built platforms get assets; the CLI errors cleanly elsewhere).
  setup:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
      prerelease: ${{ steps.pick.outputs.prerelease }}
    steps:
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          FULL='[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl","platform":"linux-x64","zig":true},{"os":"ubuntu-latest","target":"aarch64-unknown-linux-musl","platform":"linux-arm64","zig":true},{"os":"macos-latest","target":"aarch64-apple-darwin","platform":"macos-arm64","zig":false},{"os":"macos-latest","target":"x86_64-apple-darwin","platform":"macos-x64","zig":false},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","platform":"windows-x64","zig":false},{"os":"windows-latest","target":"aarch64-pc-windows-msvc","platform":"windows-arm64","zig":false}]'
          BETA='[{"os":"macos-latest","target":"aarch64-apple-darwin","platform":"macos-arm64","zig":false}]'
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "targets=$BETA" >> "$GITHUB_OUTPUT"
            echo "Prerelease ${GITHUB_REF_NAME}: building macos-arm64 only."
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "targets=$FULL" >> "$GITHUB_OUTPUT"
            echo "Stable ${GITHUB_REF_NAME}: building all 6 targets."
          fi

  # 1) Build the web app once; the `server` binary embeds it.
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vibe/local-web run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: packages/local-web/dist
          if-no-files-found: error
          retention-days: 1

  # 2) Cross-compile the three CLI binaries for the matrix chosen in `setup`.
  build-binaries:
    needs: [build-frontend, setup]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - if: matrix.zig
        uses: mlugg/setup-zig@v1
        with:
          version: ${{ env.ZIG_VERSION }}
      - if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Restore the embedded web assets the server binary expects.
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: packages/local-web/dist

      - name: Build (zigbuild)
        if: matrix.zig
        run: cargo zigbuild --release --target ${{ matrix.target }} --bin server --bin aurapunk-mcp --bin review --bin aurapunk-tui --bin aurapunk-telegram-bridge

      - name: Build (native)
        if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }} --bin server --bin aurapunk-mcp --bin review --bin aurapunk-tui --bin aurapunk-telegram-bridge

      # ONE bundle per platform. The zip carries every binary (server, mcp,
      # review, tui, telegram-bridge) plus the bundled plugin, all at the root
      # (or under plugins/). The CLI extracts the whole thing into one cache
      # dir and runs whichever binary was asked for, so a release ships one
      # asset per platform instead of a zip per binary per platform.
      - name: Package bundle (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          T="${{ matrix.target }}"; P="${{ matrix.platform }}"
          mkdir -p dist-assets pkg
          cp "target/$T/release/server" pkg/aurapunk
          cp "target/$T/release/aurapunk-mcp" pkg/aurapunk-mcp
          cp "target/$T/release/review" pkg/aurapunk-review
          cp "target/$T/release/aurapunk-tui" pkg/aurapunk-tui
          cp "target/$T/release/aurapunk-telegram-bridge" pkg/aurapunk-telegram-bridge
          mkdir -p pkg/plugins
          rsync -a --exclude='node_modules' --exclude='.git' --exclude='docker' \
            packages/jev-plugin/ pkg/plugins/fast-jev-compaction/
          (cd pkg && zip -qr "../dist-assets/aurapunk-$P.zip" *)
          ls -la dist-assets

      - name: Package bundle (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $T = "${{ matrix.target }}"; $P = "${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path dist-assets, pkg | Out-Null
          Copy-Item "target/$T/release/server.exe" "pkg/aurapunk.exe"
          Copy-Item "target/$T/release/aurapunk-mcp.exe" "pkg/aurapunk-mcp.exe"
          Copy-Item "target/$T/release/review.exe" "pkg/aurapunk-review.exe"
          Copy-Item "target/$T/release/aurapunk-tui.exe" "pkg/aurapunk-tui.exe"
          Copy-Item "target/$T/release/aurapunk-telegram-bridge.exe" "pkg/aurapunk-telegram-bridge.exe"
          New-Item -ItemType Directory -Force -Path "pkg/plugins/fast-jev-compaction" | Out-Null
          robocopy packages/jev-plugin "pkg/plugins/fast-jev-compaction" /E /XD node_modules .git docker /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
          # robocopy's 0-7 exit codes all mean success but still fail a pwsh
          # step; reset so the step's result reflects Compress-Archive.
          $global:LASTEXITCODE = 0
          Compress-Archive -Force -Path "pkg/*" -DestinationPath "dist-assets/aurapunk-$P.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.platform }}
          path: dist-assets/*.zip
          if-no-files-found: error
          retention-days: 1

  # 3) Build manifest.json (checksums) and publish the GitHub Release.
  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      # Checkout FIRST: it runs `git clean -ffdx` by default, which deletes
      # untracked paths — including a previously downloaded `assets/`. With the
      # old order (download then checkout) every CLI zip was wiped before the
      # manifest was generated, so releases shipped an empty manifest.json
      # ("platforms": {}) and no aurapunk-*.zip assets.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          path: assets
          merge-multiple: true

      # The Fast Jev Compaction plugin is no longer a standalone asset: it is
      # bundled inside every per-platform zip (pkg/plugins/fast-jev-compaction).
      - name: Generate manifest.json
        run: |
          node -e '
            const fs = require("fs"), path = require("path"), crypto = require("crypto");
            const dir = "assets";
            const version = (process.env.GITHUB_REF_NAME || "").replace(/^v/, "");
            const platforms = ["linux-x64","linux-arm64","macos-x64","macos-arm64","windows-x64","windows-arm64"];
            const out = { latest: version, platforms: {} };
            for (const f of fs.readdirSync(dir)) {
              if (!f.endsWith(".zip")) continue;
              const name = f.slice(0, -4);
              const plat = platforms.find((p) => name.endsWith("-" + p));
              if (!plat) { console.error("skip (unknown platform):", f); continue; }
              const base = name.slice(0, name.length - plat.length - 1);
              const buf = fs.readFileSync(path.join(dir, f));
              const sha256 = crypto.createHash("sha256").update(buf).digest("hex");
              (out.platforms[plat] ||= {})[base] = { sha256, size: buf.length };
            }
            fs.writeFileSync(path.join(dir, "manifest.json"), JSON.stringify(out, null, 2));
            console.log(JSON.stringify(out, null, 2));
          '

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Let GitHub build the release body ("What's Changed" from the commits
          # since the previous tag) so release pages aren't blank; the in-app
          # new-release badge reads this body and falls back to CHANGELOG.md.
          generate_release_notes: true
          # Prerelease tags (e.g. v0.2.8-beta.1) become GitHub pre-releases so the
          # CLI's releases/latest manifest pointer stays on the last stable build.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            assets/*.zip
            assets/manifest.json
          fail_on_unmatched_files: true

  # 4) Publish the CLI wrapper to npm. NOTE: no local-build.sh here, so the
  #    tarball ships only bin/ (no dist/) and runs in remote-download mode.
  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing (no NPM_TOKEN needed)
    defaults:
      run:
        working-directory: npx-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm@latest (12.x) requires node >= 22; keep this in step with it.
          node-version: 24

      # Trusted publishing (OIDC) needs npm >= 11.5.1, newer than setup-node ships.
      # Pinned to the 11.x line: npm@12.0.0 crashes on publish (its bundled
      # libnpmpublish is missing the `sigstore` module the OIDC provenance
      # attestation requires — MODULE_NOT_FOUND, seen on the v0.2.15-beta.1 run).
      - name: Update npm for trusted publishing
        run: npm install -g npm@11

      - name: Guard — version matches tag and no bundled dist
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::npx-cli version ($PKG) != tag ($TAG). Bump npx-cli/package.json before tagging."
            exit 1
          fi
          if [ -d dist ]; then
            echo "::error::dist/ present — would flip users into LOCAL_DEV_MODE. Do not build local-build.sh in this job."
            exit 1
          fi
          # Derive the npm dist-tag from the version so prereleases never clobber
          # @latest. stable X.Y.Z -> latest ; X.Y.Z-beta.N -> beta ; -rc.N -> rc.
          if [[ "$PKG" == *-* ]]; then
            PRE="${PKG#*-}"          # e.g. beta.1
            NPM_TAG="${PRE%%.*}"     # e.g. beta
          else
            NPM_TAG="latest"
          fi
          echo "NPM_DIST_TAG=$NPM_TAG" >> "$GITHUB_ENV"
          echo "Publishing $PKG to npm dist-tag: $NPM_TAG"

      - run: npm ci
      - name: Build npx launcher
        run: npm run build
      - name: Verify npx launcher version
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const version = require('./package.json').version;
          const bundle = fs.readFileSync('bin/cli.js', 'utf8');
          if (!bundle.includes(`version: \"${version}\"`)) {
            throw new Error(`bin/cli.js does not contain npx-cli version ${version}`);
          }
          console.log(`npx launcher bundle verified at ${version}`);
          NODE
      # Authenticates via OIDC (Trusted Publishing configured on npmjs.com) or
      # fallback NPM_TOKEN if secret is configured.
      - name: Publish to npm
        shell: bash
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Configuring .npmrc with provided NPM_TOKEN"
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          fi
          npm publish --access public --tag "$NPM_DIST_TAG"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
