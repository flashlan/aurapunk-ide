<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-vk-light.svg" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/svg+xml" href="/favicon-vk-dark.svg" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)">
    <title>Aurapunk IDE</title>
    <style>
      html, body { background: #121212; margin: 0; }
      /* Startup banner — covers the white flash in Tauri/window mode before React hydrates */
      #vk-startup-banner {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #121212;
        transition: opacity 280ms ease;
      }
      #vk-startup-banner.vk-startup-banner--hide {
        opacity: 0;
        pointer-events: none !important;
      }
      #vk-startup-banner img.vk-startup-icon {
        width: 210px;
        height: 210px;
        object-fit: contain;
        animation: vk-startup-pulse 1.6s ease-in-out infinite;
        filter: drop-shadow(0 10px 30px rgba(0, 200, 255, 0.2));
      }
      #vk-startup-banner .vk-startup-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(255,255,255,0.2);
        border-top-color: rgba(255,255,255,0.7);
        border-radius: 50%;
        animation: vk-startup-spin 0.8s linear infinite;
      }
      @keyframes vk-startup-spin { to { transform: rotate(360deg); } }
      @keyframes vk-startup-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.92; transform: scale(1.03); }
      }
    </style>
    <script>
      // Apply the persisted theme variant ("skin") before first paint to avoid
      // a flash of the default theme. Mirrors applyThemeVariant() in
      // shared/lib/themeVariant.ts; the React effect keeps it in sync after.
      (function () {
        try {
          var v = localStorage.getItem('vk-theme-variant');
          if (v && v !== 'default') {
            document.documentElement.dataset.themeVariant = v;
            var link = document.createElement('link');
            link.id = 'vk-theme-variant';
            link.rel = 'stylesheet';
            link.href = '/themes/' + v + '.css';
            document.head.appendChild(link);
          }
        } catch (e) {
          /* localStorage may be unavailable */
        }
      })();
    </script>
</head>

<body>
    <div id="vk-startup-banner" aria-hidden="true">
      <img class="vk-startup-icon" src="/vk-icon-app.png" alt="" width="192" height="192" />
      <div class="vk-startup-spinner" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script>
      // Polyfill crypto.randomUUID for non-secure contexts (e.g. HTTP access
      // via LAN IP). Required because @tanstack/db calls crypto.randomUUID()
      // directly without a fallback.
      // See: https://github.com/TanStack/db/issues/784
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID !== 'function') {
        crypto.randomUUID = function () {
          var bytes = new Uint8Array(16);
          if (typeof crypto.getRandomValues === 'function') {
            crypto.getRandomValues(bytes);
          } else {
            for (var i = 0; i < 16; i++) bytes[i] = Math.floor(Math.random() * 256);
          }
          // Set RFC 4122 v4 version and variant bits
          bytes[6] = (bytes[6] & 0x0f) | 0x40;
          bytes[8] = (bytes[8] & 0x3f) | 0x80;
          var h = [];
          for (var j = 0; j < 16; j++) h.push(bytes[j].toString(16).padStart(2, '0'));
          return (
            h[0] + h[1] + h[2] + h[3] + '-' +
            h[4] + h[5] + '-' +
            h[6] + h[7] + '-' +
            h[8] + h[9] + '-' +
            h[10] + h[11] + h[12] + h[13] + h[14] + h[15]
          );
        };
      }
    </script>
    <script>
      // Startup banner hide helper — dismisses cleanly as soon as React hydrates
      (function () {
        function hideVkStartupBanner() {
          var el = document.getElementById('vk-startup-banner');
          if (!el) return;
          el.style.pointerEvents = 'none';
          el.classList.add('vk-startup-banner--hide');
          setTimeout(function () {
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }, 320);
        }
        window.__vkHideStartupBanner = hideVkStartupBanner;
        // Fallback: hide after 2.5s if React fails to mount
        setTimeout(hideVkStartupBanner, 2500);
        // Also hide once React root has children
        var obs = new MutationObserver(function () {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            hideVkStartupBanner();
            obs.disconnect();
          }
        });
        obs.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
    <script type="module" src="/src/app/entry/Bootstrap.tsx"></script>
</body>

</html>
