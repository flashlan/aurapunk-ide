name: AuraPunk IDE desktop check

on:
  push:
    branches:
      - main
    paths:
      - '.gitea/workflows/desktop-check.yml'
      - 'crates/tauri-app/**'
      - 'crates/server/**'
      - 'crates/**/src/**'
      - 'packages/**'
      - 'shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The runner is on 192.168.1.91 and reaches the Proxmox host through its
  # second bridge address. The 192.168.254.25 address is not routed from it.
  PROXMOX_HOST: 192.168.1.125
  PROXMOX_CONTROLLER_USER: aurapunk-vm-controller
  PROXMOX_CONTROLLER_KEY: /run/secrets/aurapunk-vm-controller
  GITEA_REPOSITORY_URL: http://192.168.1.119:3000/datapoint/aurapunk-desktop.git

jobs:
  wake-macos:
    runs-on: release-controller
    steps:
      - name: Start the Intel macOS builder
        shell: sh
        run: |
          set -eu
          if ! command -v ssh >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y openssh-client
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache openssh-client
            else
              echo 'ssh is not available on the release controller' >&2
              exit 1
            fi
          fi
          control() {
            ssh -i "$PROXMOX_CONTROLLER_KEY" -o BatchMode=yes \
              -o ConnectTimeout=8 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/tmp/proxmox_known_hosts \
              "$PROXMOX_CONTROLLER_USER@$PROXMOX_HOST" "$@"
          }
          if ! control status 116 | grep -q 'running'; then
            control start 116
          fi
          for _ in $(seq 1 30); do
            control status 116 | grep -q 'running' && exit 0
            sleep 2
          done
          exit 1

  wake-windows:
    runs-on: release-controller
    steps:
      - name: Start the Windows builder
        shell: sh
        run: |
          set -eu
          if ! command -v ssh >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y openssh-client
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache openssh-client
            else
              echo 'ssh is not available on the release controller' >&2
              exit 1
            fi
          fi
          control() {
            ssh -i "$PROXMOX_CONTROLLER_KEY" -o BatchMode=yes \
              -o ConnectTimeout=8 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/tmp/proxmox_known_hosts \
              "$PROXMOX_CONTROLLER_USER@$PROXMOX_HOST" "$@"
          }
          if ! control status 135 | grep -q 'running'; then
            control start 135
          fi
          for _ in $(seq 1 30); do
            control status 135 | grep -q 'running' && exit 0
            sleep 2
          done
          exit 1

  build-macos-x64:
    needs: wake-macos
    runs-on: macos-x64
    steps:
      - name: Checkout from Gitea
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main "$GITEA_REPOSITORY_URL" .
      - name: Build AuraPunk IDE Desktop
        run: |
          set -euo pipefail
          export PATH="$HOME/tools/node/bin:$HOME/.cargo/bin:$PATH"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm app:build
          test -d target/release/bundle
          find target/release/bundle -maxdepth 2 -type f -print

  build-windows-x64:
    needs: wake-windows
    runs-on: windows-x64
    steps:
      - name: Checkout from Gitea
        shell: cmd
        run: |
          @echo on
          git clone --depth 1 --branch main "%GITEA_REPOSITORY_URL%" .
          if errorlevel 1 exit /b 1
      - name: Build AuraPunk IDE Desktop
        shell: cmd
        run: |
          @echo on
          call corepack.cmd enable
          if errorlevel 1 exit /b 1
          call pnpm.cmd install --frozen-lockfile
          if errorlevel 1 exit /b 1
          set "PATH=C:\Users\sandman\.cargo\bin;%PATH%"
          cargo.exe --version
          if errorlevel 1 exit /b 1
          call pnpm.cmd app:build
          if errorlevel 1 exit /b 1
          if not exist target\release\bundle exit /b 1
          dir /s /b target\release\bundle

  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout from Gitea
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main "$GITEA_REPOSITORY_URL" .
      - name: Build AuraPunk IDE Linux
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.0-dev \
            patchelf
          if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm app:build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'
          test -d target/release/bundle/appimage
          find target/release/bundle/appimage -maxdepth 1 -type f -print

  shutdown-builders:
    needs: [wake-macos, wake-windows, build-macos-x64, build-windows-x64, build-linux-x64]
    # Keep failed builders online for diagnosis and toolchain repair. A
    # successful build still shuts both VMs down automatically.
    if: ${{ always() && needs.build-macos-x64.result == 'success' && needs.build-windows-x64.result == 'success' }}
    runs-on: release-controller
    steps:
      - name: Stop native builder VMs
        shell: sh
        run: |
          set -eu
          if ! command -v ssh >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y openssh-client
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache openssh-client
            else
              echo 'ssh is not available on the release controller' >&2
              exit 1
            fi
          fi
          control() {
            ssh -i "$PROXMOX_CONTROLLER_KEY" -o BatchMode=yes \
              -o ConnectTimeout=8 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/tmp/proxmox_known_hosts \
              "$PROXMOX_CONTROLLER_USER@$PROXMOX_HOST" "$@"
          }
          for vmid in 116 135; do
            if control status "$vmid" | grep -q 'running'; then
              control shutdown "$vmid"
            fi
          done
