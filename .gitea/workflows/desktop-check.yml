name: AuraPunk IDE desktop check

on:
  push:
    branches:
      - main
    paths:
      - '.gitea/workflows/desktop-check.yml'
      - 'crates/tauri-app/**'
      - 'crates/server/**'
      - 'crates/**/src/**'
      - 'packages/**'
      - 'shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROXMOX_HOST: 192.168.254.25
  PROXMOX_CONTROLLER_USER: aurapunk-vm-controller
  PROXMOX_CONTROLLER_KEY: /run/secrets/aurapunk-vm-controller

jobs:
  wake-macos:
    runs-on: release-controller
    steps:
      - name: Start the Intel macOS builder
        shell: sh
        run: |
          set -eu
          apk add --no-cache openssh-client
          control() {
            ssh -i "$PROXMOX_CONTROLLER_KEY" -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/tmp/proxmox_known_hosts \
              "$PROXMOX_CONTROLLER_USER@$PROXMOX_HOST" "$@"
          }
          if ! control status 116 | grep -q 'running'; then
            control start 116
          fi
          for _ in $(seq 1 30); do
            control status 116 | grep -q 'running' && exit 0
            sleep 2
          done
          exit 1

  wake-windows:
    runs-on: release-controller
    steps:
      - name: Start the Windows builder
        shell: sh
        run: |
          set -eu
          apk add --no-cache openssh-client
          control() {
            ssh -i "$PROXMOX_CONTROLLER_KEY" -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/tmp/proxmox_known_hosts \
              "$PROXMOX_CONTROLLER_USER@$PROXMOX_HOST" "$@"
          }
          if ! control status 135 | grep -q 'running'; then
            control start 135
          fi
          for _ in $(seq 1 30); do
            control status 135 | grep -q 'running' && exit 0
            sleep 2
          done
          exit 1

  build-macos-x64:
    needs: wake-macos
    runs-on: macos-x64
    steps:
      - uses: actions/checkout@v4
      - name: Build AuraPunk IDE Desktop
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm app:build
          test -d target/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: aurapunk-ide-check-macos-x64
          path: target/release/bundle/**
          if-no-files-found: error
          retention-days: 3

  build-windows-x64:
    needs: wake-windows
    runs-on: windows-x64
    steps:
      - uses: actions/checkout@v4
      - name: Build AuraPunk IDE Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          pnpm install --frozen-lockfile
          pnpm app:build
          if (-not (Test-Path 'target/release/bundle')) { throw 'Desktop bundle directory was not created' }
      - uses: actions/upload-artifact@v4
        with:
          name: aurapunk-ide-check-windows-x64
          path: target/release/bundle/**
          if-no-files-found: error
          retention-days: 3

  shutdown-builders:
    needs: [wake-macos, wake-windows, build-macos-x64, build-windows-x64]
    if: always()
    runs-on: release-controller
    steps:
      - name: Stop native builder VMs
        shell: sh
        run: |
          set -eu
          apk add --no-cache openssh-client
          control() {
            ssh -i "$PROXMOX_CONTROLLER_KEY" -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/tmp/proxmox_known_hosts \
              "$PROXMOX_CONTROLLER_USER@$PROXMOX_HOST" "$@"
          }
          for vmid in 116 135; do
            if control status "$vmid" | grep -q 'running'; then
              control shutdown "$vmid"
            fi
          done
