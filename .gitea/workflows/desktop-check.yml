name: AuraPunk IDE desktop check

on:
  push:
    branches:
      - main
    paths:
      - '.gitea/workflows/desktop-check.yml'
      - 'crates/tauri-app/**'
      - 'crates/server/**'
      - 'crates/**/src/**'
      - 'packages/**'
      - 'shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The runner is on 192.168.1.91 and reaches the Proxmox host through its
  # second bridge address. The 192.168.254.25 address is not routed from it.
  PROXMOX_HOST: 192.168.1.125
  PROXMOX_CONTROLLER_USER: aurapunk-vm-controller
  PROXMOX_CONTROLLER_KEY: /run/secrets/aurapunk-vm-controller
  GITEA_REPOSITORY_URL: http://192.168.1.119:3000/datapoint/aurapunk-desktop.git

jobs:
  wake-macos:
    runs-on: release-controller
    steps:
      - name: Start the Intel macOS builder
        shell: sh
        run: |
          set -eu
          if ! command -v ssh >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              for attempt in 1 2 3 4 5; do
                apt-get update && apt-get install -y openssh-client && break
                [ "$attempt" -eq 5 ] && exit 1
                sleep 5
              done
            elif command -v apk >/dev/null 2>&1; then
              for attempt in 1 2 3 4 5; do
                apk add --no-cache openssh-client && break
                [ "$attempt" -eq 5 ] && exit 1
                sleep 5
              done
            else
              echo 'ssh is not available on the release controller' >&2
              exit 1
            fi
          fi
          control() {
            ssh -i "$PROXMOX_CONTROLLER_KEY" -o BatchMode=yes \
              -o ConnectTimeout=8 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/tmp/proxmox_known_hosts \
              "$PROXMOX_CONTROLLER_USER@$PROXMOX_HOST" "$@"
          }
          if ! control status 116 | grep -q 'running'; then
            control start 116
          fi
          for _ in $(seq 1 30); do
            control status 116 | grep -q 'running' && exit 0
            sleep 2
          done
          exit 1

  wake-windows:
    runs-on: release-controller
    steps:
      - name: Start the Windows builder
        shell: sh
        run: |
          set -eu
          if ! command -v ssh >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              for attempt in 1 2 3 4 5; do
                apt-get update && apt-get install -y openssh-client && break
                [ "$attempt" -eq 5 ] && exit 1
                sleep 5
              done
            elif command -v apk >/dev/null 2>&1; then
              for attempt in 1 2 3 4 5; do
                apk add --no-cache openssh-client && break
                [ "$attempt" -eq 5 ] && exit 1
                sleep 5
              done
            else
              echo 'ssh is not available on the release controller' >&2
              exit 1
            fi
          fi
          control() {
            ssh -i "$PROXMOX_CONTROLLER_KEY" -o BatchMode=yes \
              -o ConnectTimeout=8 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/tmp/proxmox_known_hosts \
              "$PROXMOX_CONTROLLER_USER@$PROXMOX_HOST" "$@"
          }
          if ! control status 135 | grep -q 'running'; then
            control start 135
          fi
          for _ in $(seq 1 30); do
            control status 135 | grep -q 'running' && exit 0
            sleep 2
          done
          exit 1

  build-macos-x64:
    needs: wake-macos
    runs-on: macos-x64
    steps:
      - name: Checkout from Gitea
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main "$GITEA_REPOSITORY_URL" .
      - name: Build AuraPunk IDE Desktop
        run: |
          set -euo pipefail
          export PATH="$HOME/tools/node/bin:$HOME/.cargo/bin:$PATH"
          if [ -f "$HOME/gitea-runner/aurapunk-ide.key" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$(cat "$HOME/gitea-runner/aurapunk-ide.key")"
          else
            echo 'Tauri signing key is missing from the macOS builder' >&2
            exit 1
          fi
          corepack enable
          pnpm install --frozen-lockfile
          pnpm app:build
          test -d target/release/bundle
          find target/release/bundle -maxdepth 2 -type f -print
          rm -rf "$HOME/gitea-runner/build-output/macos"
          mkdir -p "$HOME/gitea-runner/build-output/macos"
          cp -R target/release/bundle/. "$HOME/gitea-runner/build-output/macos/"

  build-windows-x64:
    needs: wake-windows
    runs-on: windows-x64
    steps:
      - name: Checkout from Gitea
        shell: cmd
        run: |
          @echo on
          git clone --depth 1 --branch main "%GITEA_REPOSITORY_URL%" .
          if errorlevel 1 exit /b 1
      - name: Build AuraPunk IDE Desktop
        shell: cmd
        run: |
          @echo on
          call corepack.cmd enable
          if errorlevel 1 exit /b 1
          call pnpm.cmd install --frozen-lockfile
          if errorlevel 1 exit /b 1
          set "CARGO_HOME=C:\Users\sandman\.cargo"
          set "RUSTUP_HOME=C:\Users\sandman\.rustup"
          set "CARGO_NET_RETRY=10"
          set "CARGO_NET_GIT_FETCH_WITH_CLI=true"
          set "CARGO_HTTP_MULTIPLEXING=false"
          set "LIBCLANG_PATH=C:\msys64\mingw64\bin"
          set "PATH=C:\msys64\mingw64\bin;%PATH%"
          set "PATH=C:\Users\sandman\.cargo\bin;%PATH%"
          C:\Users\sandman\.cargo\bin\cargo.exe --version
          if errorlevel 1 exit /b 1
          call pnpm.cmd --filter @vibe/local-web run build
          if errorlevel 1 exit /b 1
          set "SYSTEM_NSIS_ROOT=C:\Program Files (x86)\NSIS"
          if not exist "%SYSTEM_NSIS_ROOT%\makensis.exe" exit /b 1
          if not defined LOCALAPPDATA set "LOCALAPPDATA=C:\Windows\System32\config\systemprofile\AppData\Local"
          set "TAURI_NSIS_ROOT=%LOCALAPPDATA%\tauri\NSIS"
          if not exist "%TAURI_NSIS_ROOT%" mkdir "%TAURI_NSIS_ROOT%"
          if not exist "%TAURI_NSIS_ROOT%\Include\MUI2.nsh" (
            echo Tauri NSIS cache is missing its toolset files
            exit /b 1
          )
          if not exist "%TAURI_NSIS_ROOT%\Bin" mkdir "%TAURI_NSIS_ROOT%\Bin"
          copy /Y "%SYSTEM_NSIS_ROOT%\makensis.exe" "%TAURI_NSIS_ROOT%\makensis.exe" >nul
          if errorlevel 1 exit /b 1
          copy /Y "%SYSTEM_NSIS_ROOT%\makensis.exe" "%TAURI_NSIS_ROOT%\Bin\makensis.exe" >nul
          if errorlevel 1 exit /b 1
          "%SYSTEM_NSIS_ROOT%\makensis.exe" /VERSION
          if errorlevel 1 exit /b 1
          cd crates\tauri-app
          call npx.cmd @tauri-apps/cli build --config tauri.build.conf.json --no-bundle
          if errorlevel 1 exit /b 1
          cd ..\..
          if not exist target\release\vibe-kanban-tauri.exe exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\windows-test-sign.ps1 -Path target\release\vibe-kanban-tauri.exe
          if errorlevel 1 exit /b 1
          cd crates\tauri-app
          call npx.cmd @tauri-apps/cli bundle --config tauri.build.conf.json --bundles nsis
          if errorlevel 1 exit /b 1
          cd ..\..
          set "INSTALLER_FILE="
          for /R target\release\bundle\nsis %%F in (*-setup.exe) do set "INSTALLER_FILE=%%F"
          if not defined INSTALLER_FILE exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\windows-test-sign.ps1 -Path "%INSTALLER_FILE%"
          if errorlevel 1 exit /b 1
          if exist "C:\AuraPunk\gitea-runner\build-output\windows" rmdir /s /q "C:\AuraPunk\gitea-runner\build-output\windows"
          mkdir "C:\AuraPunk\gitea-runner\build-output\windows"
          copy /Y "%INSTALLER_FILE%" "C:\AuraPunk\gitea-runner\build-output\windows\AuraPunk-IDE-setup.exe"
          dir /s /b "C:\AuraPunk\gitea-runner\build-output\windows"

  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout from Gitea
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main "$GITEA_REPOSITORY_URL" .
      - name: Build AuraPunk IDE Linux
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            apt-get -o Acquire::Check-Valid-Until=false -o Acquire::Retries=3 update && break
            [ "$attempt" -eq 5 ] && exit 1
            sleep 10
          done
          apt-get install -y \
            clang \
            libappindicator3-dev \
            libclang-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf
          if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          export CARGO_NET_RETRY=10
          export CARGO_HTTP_MULTIPLEXING=false
          corepack enable
          pnpm install --frozen-lockfile
          pnpm app:build
          test -d target/release/bundle/appimage
          find target/release/bundle/appimage -maxdepth 1 -type f -print

  shutdown-builders:
    needs: [wake-macos, wake-windows, build-macos-x64, build-windows-x64, build-linux-x64]
    # Keep failed builders online for diagnosis and toolchain repair. A
    # successful build still shuts both VMs down automatically.
    if: ${{ always() && needs.build-macos-x64.result == 'success' && needs.build-windows-x64.result == 'success' }}
    runs-on: release-controller
    steps:
      - name: Stop native builder VMs
        shell: sh
        run: |
          set -eu
          if ! command -v ssh >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              for attempt in 1 2 3 4 5; do
                apt-get update && apt-get install -y openssh-client && break
                [ "$attempt" -eq 5 ] && exit 1
                sleep 5
              done
            elif command -v apk >/dev/null 2>&1; then
              for attempt in 1 2 3 4 5; do
                apk add --no-cache openssh-client && break
                [ "$attempt" -eq 5 ] && exit 1
                sleep 5
              done
            else
              echo 'ssh is not available on the release controller' >&2
              exit 1
            fi
          fi
          control() {
            ssh -i "$PROXMOX_CONTROLLER_KEY" -o BatchMode=yes \
              -o ConnectTimeout=8 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/tmp/proxmox_known_hosts \
              "$PROXMOX_CONTROLLER_USER@$PROXMOX_HOST" "$@"
          }
          for vmid in 116 135; do
            if control status "$vmid" | grep -q 'running'; then
              control shutdown "$vmid"
            fi
          done
