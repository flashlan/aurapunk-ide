name = "Quick"
description = "Minimal flow for trivial cards: no spec, no plan, no subagent fan-out. Quick is prepared for target-checkout execution, so it verifies that it is on main rather than a disposable worktree before changing code."

[[stage]]
id = "orchestrate"
label = "Orchestrate (auto-drive)"
default_enabled = false
prompt = "Have the orchestrator agent pick this card up and drive it to done autonomously, running the card's pipeline stages in order — regardless of which board column the card is in (it may be started even from Todo)."

[[stage]]
id = "memory"
label = "Project memory (mem0)"
default_enabled = true
prompt = "General project rules: call `get_rules` before starting this card and keep its `pre` guidance in mind throughout; run through `post` as a closing checklist before finishing."

[[stage]]
id = "target-checkout"
label = "Verify target checkout (main)"
default_enabled = true
prompt = "Before reading or editing project code, prove this Quick run is operating in the repository's real target checkout, not a generated workspace worktree. Run `git rev-parse --show-toplevel`, `git branch --show-current`, and `git worktree list --porcelain`. The current directory must be the checkout reported for the target branch (normally `main`), and the current branch must equal that target branch. Inspect `git status --short` too: do not absorb unrelated operator changes. If any check says you are in a `vk/...` branch, an AuraPunk worktree, a detached HEAD, or any checkout other than the target checkout, STOP before changing files; do not try to switch branches yourself. Emit `VK-ESCALATE: quick-target-checkout-required — <observed branch and directory>` as the first line of the final message so the Integration Guard can route or repair the run. Only after all checks pass and the checkout is clean, record the recovery point with `git commit --allow-empty -m \"chore(quick): checkpoint before <card id or title>\"`; report its SHA to the Integration Guard and continue."

[[stage]]
id = "implement"
label = "Implement directly"
default_enabled = true
prompt = "Implement this card directly from its description — do NOT write SPEC.md or IMPLEMENTATION_PLAN.md and do NOT spawn spec/plan subagents; this card was classified trivial, so the description itself is the work order. Keep the diff minimal and focused on exactly what the card names. Then verify: run the project's standard checks (build, tests, lint — whatever the repo's guides name) plus the most direct manual check of the card's own claim, and fix what you broke. Track the work as a `TodoWrite` checklist from the very first step through the final verification step — including an explicit last item like \"operator verifies: <what to check>\" that the human ticks off after the run — so the session's Tasks view populates and doubles as the verification checklist. ESCALATION TRIPWIRE: if while working you discover this is NOT trivial — the root cause lives elsewhere, more than ~3 files need changing, or an open design decision appears — STOP instead of pushing through: commit any safe work-in-progress so nothing is lost, leave the tree otherwise clean, and make the FIRST line of your final message exactly `VK-ESCALATE: trivial->light — <one-line evidence>` (or `trivial->medium` if the discovery is clearly larger) so the orchestrator can surface it and the card can be re-routed to a fuller pipeline. Do not advance any later stage after emitting the marker."

[[stage]]
id = "code-review"
label = "Review via Codex"
default_enabled = false
prompt = "After implementing, run an independent Codex review of the card's diff (the `codex-review` skill / Codex CLI), iterating until it reports no significant findings. Address confirmed findings and re-verify before marking the card ready."

[[stage]]
id = "review-manual"
label = "Manual review (alarm)"
default_enabled = false
prompt = "MANUAL REVIEW: stop here and hand the work to the operator. Commit all work-in-progress first (staged, with a descriptive message) so nothing is lost, leave the tree otherwise clean, then emit a line exactly like `VK-REVIEW-REQUEST: <one-line summary of what to review and where>` and STOP — this triggers an alarm so the operator reviews the result. Do NOT advance to any later stage, do NOT merge, and do NOT open a PR until the operator responds with explicit instructions."
[[stage]]
id = "merge"
label = "Integration Guard → Done"
default_enabled = true
prompt = "When the work is implemented and verified, commit it and call `complete_workspace_card` yourself as the final action through the normal card workflow. Do not stop after committing, ask the operator to click Merge or Done, or claim completion without a successful tool response. The Integration Guard records the task's original target HEAD and performs a three-way integration, so independent target changes do not require a rebase. If semantic or Git overlap is reported, leave the card open and report the conflict for review. Do not manually merge, rebase, update refs, push, or open a PR."

[[stage]]
id = "pr"
label = "Open pull request"
default_enabled = false
prompt = "When the work is implemented and reviewed, open a pull request for this card against the base branch."
